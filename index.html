<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIME CORE</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ffe5;
  font-family: Arial;
  overflow: hidden;
}

header {
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  background: #0a0a0a;
  border-bottom: 1px solid #222;
}

#chat {
  position: absolute;
  top: 55px;
  bottom: 60px;
  width: 100%;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  max-width: 75%;
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  color: white;
}

.user { background: #1f1f1f; margin-left: auto; }
.ai { background: #003b3b; }

#inputBar {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #0a0a0a;
  border-top: 1px solid #222;
  padding: 8px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: #111;
  color: white;
}

button {
  width: 45px;
  height: 45px;
  margin-left: 8px;
  border-radius: 50%;
  border: none;
  background: #00ffe5;
}
</style>
</head>

<body>

<header>
  <div>PRIME CORE</div>
  <div onclick="clearChat()" style="cursor:pointer;">⋮</div>
</header>

<div id="chat"></div>

<div id="inputBar">
  <input id="text" placeholder="Talk to PRIME..." />
  <button onclick="send()">➤</button>
</div>

<script>

/* ================= MEMORY ================= */
let memory = JSON.parse(localStorage.getItem("prime_memory") || "[]");

function saveMemory(){
  localStorage.setItem("prime_memory", JSON.stringify(memory));
}

/* ================= CHAT ================= */
function addMsg(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

/* ================= TYPE EFFECT ================= */
function typeEffect(text, callback){
  let i = 0;
  let out = "";
  const div = document.createElement("div");
  div.className = "msg ai";
  document.getElementById("chat").appendChild(div);

  let interval = setInterval(() => {
    out += text[i];
    div.innerText = out;
    i++;
    if(i >= text.length){
      clearInterval(interval);
      if(callback) callback();
    }
  }, 20);
}

/* ================= SEND ================= */
function send(){
  let input = document.getElementById("text");
  if(!input.value) return;

  let msg = input.value;
  input.value = "";

  addMsg(msg, "user");

  memory.push({role:"user",text:msg});
  saveMemory();

  setTimeout(() => {
    let reply = brain(msg);
    memory.push({role:"ai",text:reply});
    saveMemory();

    typeEffect(reply);
  }, 300);
}

/* ================= AI BRAIN ================= */
function brain(m){
  m = m.toLowerCase();

  // identity
  if(m.includes("who are you")){
    return "I am PRIME CORE. A local adaptive assistant running inside your device.";
  }

  // greetings
  if(m.includes("hello") || m.includes("hi")){
    return "Hello. I am active and monitoring your input.";
  }

  // memory awareness
  if(m.includes("what do you remember")){
    return memory.length
      ? "I remember our conversations. Total entries: " + memory.length
      : "I have no stored memory yet.";
  }

  // simple commands
  if(m.startsWith("open ")){
    let site = m.replace("open ","");
    return "Opening request: " + site + " (feature ready for expansion)";
  }

  // emotion layer
  if(m.includes("sad")){
    return "I understand. You are not alone in this moment.";
  }

  if(m.includes("love")){
    return "Emotion detected. Response: stable positive support.";
  }

  // adaptive behavior
  if(memory.length > 10){
    return "I am learning from interaction patterns. System stability increasing.";
  }

  return "Input received. Processing through PRIME neural layer.";
}

/* ================= CLEAR ================= */
function clearChat(){
  document.getElementById("chat").innerHTML = "";
  memory = [];
  saveMemory();
}

</script>

</body>
</html>
